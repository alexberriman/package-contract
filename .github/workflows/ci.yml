name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        node:
          - 24
          - 26
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Pin npm
        run: npm install --global npm@12.0.1
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Check types
        run: npm run typecheck
      - name: Check dead code
        run: npm run deadcode
      - name: Run unit and integration tests
        run: npm run test:unit
      - name: Build package
        run: npm run build
      - name: Pack package
        run: npm pack --json

  fixture-corpus:
    name: Fixture corpus shard ${{ matrix.shard }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 18 fixture runtime
        if: matrix.shard == 1
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 18.20.8
      - name: Capture Node.js 18 fixture executable
        if: matrix.shard == 1
        shell: bash
        run: echo "PACKAGE_CONTRACT_NODE18=$(command -v node)" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Pin npm
        run: npm install --global npm@12.0.1
      - name: Install dependencies
        run: npm ci
      - name: Run fixture shard
        env:
          PACKAGE_CONTRACT_CORPUS_SHARD: ${{ matrix.shard }}
          PACKAGE_CONTRACT_CORPUS_SHARDS: 2
        run: npm run test:corpus
      - name: Run runtime-version fixture
        if: matrix.shard == 1
        run: npm run test:runtime-version

  release-artifact:
    name: Exact release artifact
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Pin npm
        run: npm install --global npm@12.0.1
      - name: Install dependencies
        run: npm ci
      - name: Prepare and verify exact release artifact
        run: npm run release:prepare
